name: Build

on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  buildAndroid:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6.0.3

      - uses: krdlab/setup-haxe@v2.1.0
        with:
          haxe-version: 4.3.7

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Install Haxelib
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp > /dev/null --quiet
          haxelib install hmm --quiet
          haxelib run hmm install

      - name: Configure Lime
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT ${{ steps.setup-ndk.outputs.ndk-path }}
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Compile
        run: haxelib run lime build Project.xml android -Dartifact

      - name: Publish Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: androidBuild
          path: export/release/android/bin/app/build/outputs/apk/debug/*.apk

  buildIOS:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6.0.3

      - uses: krdlab/setup-haxe@v2.1.0
        with:
          haxe-version: 4.3.7

      - name: Install Haxelib
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp > /dev/null --quiet
          haxelib install hmm --quiet
          haxelib run hmm install

      - name: Compile
        run: haxelib run lime build Project.xml ios -nosign -Dartifact

      - name: Package IPA
        run: |
          APP_PATH=$(find export/release/ios/build -name "*.app" -maxdepth 3 | head -n 1)
          mkdir -p ipa/Payload
          cp -R "$APP_PATH" ipa/Payload/
          cd ipa
          zip -qr ../TrollEngine.ipa Payload

      - name: Publish Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: iosBuild
          path: TrollEngine.ipa
